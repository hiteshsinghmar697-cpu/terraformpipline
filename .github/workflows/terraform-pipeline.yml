name: Terraform Plan Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-plan:
    name: Terraform Init & Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./envirment/prod
        shell: powershell

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Azure Login
        run: |
          Write-Host "Checking Azure Login Status..."
          az account show

      - name: Terraform Init
        run: |
          Write-Host "Initializing Terraform..."
          terraform init

      - name: Terraform Validate
        run: |
          Write-Host "Validating Terraform Configuration..."
          terraform validate

      - name: Terraform Plan
        run: |
          Write-Host "Running Terraform Plan..."
          terraform plan
