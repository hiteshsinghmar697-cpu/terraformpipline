name: Terraform Plan Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      azure_username:
        description: 'Azure Username / Email'
        required: false
        type: string
      azure_password:
        description: 'Azure Password'
        required: false
        type: string
      azure_tenant_id:
        description: 'Azure Tenant ID'
        required: false
        default: '49d3c8f2-e6c8-498e-9e28-018bca472654'
        type: string
      azure_subscription_id:
        description: 'Azure Subscription ID'
        required: false
        default: 'bc965e9b-edbc-4bca-ba1c-aff57e333e91'
        type: string

jobs:
  terraform-plan:
    name: Terraform Init & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./envirment/prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # Step 1: Manual Login using Workflow Inputs (if username & password entered in UI)
      - name: Manual Input Azure Login
        if: ${{ github.event.inputs.azure_username != '' && github.event.inputs.azure_password != '' }}
        run: |
          echo "Logging in with user credentials from GitHub UI inputs..."
          az login -u "${{ github.event.inputs.azure_username }}" -p "${{ github.event.inputs.azure_password }}" --tenant "${{ github.event.inputs.azure_tenant_id }}"
          az account set --subscription "${{ github.event.inputs.azure_subscription_id }}"
          az account show

      # Step 2: Device Code Login Fallback (if no inputs provided in UI)
      - name: Device Code Azure Login (Fallback)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.azure_username == '' || github.event.inputs.azure_password == '') }}
        run: |
          echo "================================================================="
          echo " MANUAL AZURE DEVICE CODE LOGIN"
          echo " Open: https://microsoft.com/devicelogin in your browser"
          echo " Enter the device code below to authenticate."
          echo "================================================================="
          az login --use-device-code
          az account show

      - name: Terraform Init
        run: |
          echo "Initializing Terraform..."
          terraform init

      - name: Terraform Validate
        run: |
          echo "Validating Terraform Configuration..."
          terraform validate

      - name: Terraform Plan
        run: |
          echo "Running Terraform Plan..."
          terraform plan
