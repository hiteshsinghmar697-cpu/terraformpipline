name: Terraform Plan Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      login_method:
        description: 'Azure Login Method'
        required: true
        default: 'device_code'
        type: choice
        options:
          - device_code
          - secrets

jobs:
  terraform-plan:
    name: Terraform Init & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./envirment/prod

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # Option A: Login via Stored Secrets
      - name: Azure Secret Login
        uses: azure/login@v2
        if: ${{ github.event.inputs.login_method == 'secrets' || (github.event_name != 'workflow_dispatch' && env.AZURE_CREDENTIALS != '') }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Option B: Manual Device Code Login
      - name: Manual Azure Device Code Login
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.login_method == 'device_code' || github.event.inputs.login_method == '') }}
        run: |
          echo "================================================================="
          echo " MANUAL AZURE LOGIN REQUIRED"
          echo " Open: https://microsoft.com/devicelogin in your browser"
          echo " Enter the device code that appears below to complete sign in."
          echo "================================================================="
          az login --use-device-code
          az account show

      - name: Terraform Init
        run: |
          echo "Initializing Terraform..."
          terraform init

      - name: Terraform Validate
        run: |
          echo "Validating Terraform Configuration..."
          terraform validate

      - name: Terraform Plan
        run: |
          echo "Running Terraform Plan..."
          terraform plan
